<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Arts Tracker</title>
    <style>
        /* Modern deep navy background */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0B132B;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        .app-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: center;
        }

        canvas {
            transform: scaleX(-1);
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 25px;
            position: absolute;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header {
            top: 20px;
            left: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .accent {
            color: #FF8C00;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
        }

        /* New Settings UI */
        .settings-card {
            top: 20px;
            right: 20px;
            min-width: 200px;
        }

        .settings-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #FF8C00;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        .slider-container label {
            font-size: 0.85rem;
            opacity: 0.9;
            display: block;
            margin-bottom: 5px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #FF8C00;
        }

        .status-card {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 350px;
        }

        .status-card p {
            margin: 5px 0 10px 0;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .status-indicator {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="app-container">

        <div class="glass-panel header">
            <h1>Mystic Arts <span class="accent">Tracker</span></h1>
        </div>

        <!-- New Settings Panel -->
        <div class="glass-panel settings-card">
            <h3>⚙️ Settings</h3>

            <div class="slider-container">
                <label for="sizeSlider">Shield Size: <span id="sizeValue">5.0</span>x</label>
                <input type="range" id="sizeSlider" min="2" max="10" step="0.5" value="5">
            </div>

            <div class="slider-container" style="margin-bottom: 0;">
                <label for="speedSlider">Rotation Speed: <span id="speedValue">1.0</span>x</label>
                <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1.0">
            </div>
        </div>

        <div class="glass-panel status-card">
            <p>Hold up your hand and form a <strong>closed fist</strong></p>
            <div id="status-text" class="status-indicator" style="color: #aaaaaa;">
                Initializing Camera...
            </div>
        </div>

        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <video id="shieldVideo" src="shield.mp4" loop muted autoplay playsinline style="display:none;"></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>

    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const shieldVideo = document.getElementById('shieldVideo');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');

        // Interactive Settings Logic
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        let currentSizeMultiplier = 5.0;

        sizeSlider.addEventListener('input', (e) => {
            currentSizeMultiplier = parseFloat(e.target.value);
            sizeValue.innerText = currentSizeMultiplier.toFixed(1);
        });

        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        speedSlider.addEventListener('input', (e) => {
            const speed = parseFloat(e.target.value);
            shieldVideo.playbackRate = speed; // Adjusts the video's natural animation speed
            speedValue.innerText = speed.toFixed(1);
        });

        function calculateDistance(p1, p2) {
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let isCasting = false;
            let handsVisible = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handsVisible = true;

                for (const landmarks of results.multiHandLandmarks) {
                    const wrist = landmarks[0];
                    const middleFingerBase = landmarks[9];
                    const middleFingerTip = landmarks[12];
                    const indexKnuckle = landmarks[5];
                    const pinkyKnuckle = landmarks[17];

                    const distTipToWrist = calculateDistance(wrist, middleFingerTip);
                    const distBaseToWrist = calculateDistance(wrist, middleFingerBase);

                    if (distTipToWrist < distBaseToWrist + 0.05) {
                        isCasting = true;

                        const palmWidth = calculateDistance(indexKnuckle, pinkyKnuckle) * canvasElement.width;

                        // Apply the dynamic size multiplier from the slider
                        const shieldSize = palmWidth * currentSizeMultiplier;

                        const cx = wrist.x * canvasElement.width;
                        const cy = wrist.y * canvasElement.height;

                        canvasCtx.globalCompositeOperation = 'screen';

                        if (shieldVideo.readyState >= 2) {
                            canvasCtx.drawImage(
                                shieldVideo,
                                cx - (shieldSize / 2),
                                cy - (shieldSize / 2),
                                shieldSize,
                                shieldSize
                            );
                        }
                        canvasCtx.globalCompositeOperation = 'source-over';
                    }
                }
            }
            canvasCtx.restore();

            if (isCasting) {
                statusText.innerText = "🔥 Spell Cast: Shield Active!";
                statusText.style.color = "#FF8C00";
                statusText.style.boxShadow = "0 0 15px rgba(255, 140, 0, 0.4)";
            } else if (handsVisible) {
                statusText.innerText = "Tracking Hand Gestures...";
                statusText.style.color = "#4CAF50";
                statusText.style.boxShadow = "none";
            } else {
                statusText.innerText = "Waiting for hands...";
                statusText.style.color = "#ffffff";
                statusText.style.boxShadow = "none";
            }
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>

</html>
